[package]
name = "sc-plotter-wasm"
version = "0.0.0"
authors = ["MultiversX <contact@multiversx.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/multiversx/mx-sdk-rs"
description = "Web app for displaying function graphs from the framework"
edition = "2024"
publish = false

[lib]
crate-type=["cdylib"]

[dependencies]
plotters = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
plotters-canvas = "0.3"

[profile.release]
lto = true

[dependencies.multiversx-sc]
version = "=0.65.1"
path = "../../framework/base"

[dependencies.multiversx-sc-scenario]
version = "=0.65.1"
path = "../../framework/scenario"
default-features = false

[workspace]
members = ["."]

[patch.crates-io]
multiversx-chain-vm-executor = { git = "https://github.com/Shanmugavardhan/mx-vm-executor-rs", rev = "69167eb16e3ed3874e77b48df29daa9acb5c8b25"}
multiversx-chain-vm-executor-wasmer-experimental = { git = "https://github.com/Shanmugavardhan/mx-vm-executor-rs", rev = "69167eb16e3ed3874e77b48df29daa9acb5c8b25"}